name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Type check (src + vite.config)
        run: |
          npx tsc --noEmit
          npx tsc -p tsconfig.node.json

      - name: Run tests
        run: npm test

      - name: Production build (vite build smoke)
        # #58: catches breakages that tsc + vitest can miss — minification
        # quirks, manualChunks regressions, modulePreload filter typos, etc.
        run: npm run build

  rust:
    name: Rust (cargo build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        working-directory: src-tauri
        run: cargo build

      - name: Test
        working-directory: src-tauri
        run: cargo test

      - name: Perf smoke (catastrophic-regression gate)
        # tests/perf_smoke.rs asserts hard 10–15 s ceilings (well above the
        # §5.1 p95 targets) so a catastrophic O(n^2) regression in the import
        # / export / SQLite-save pipelines fails CI. Generous ceilings absorb
        # slow Windows CI runners; the tight §5.1 numbers are checked by the
        # signal-only perf step below.
        working-directory: src-tauri
        run: cargo test --release --test perf_smoke -- --include-ignored --nocapture

      - name: Perf gate (req 5.1 budgets — signal only)
        # #41: opt-in via COCO_PERF_GATE=1 — print_results() in tests/perf.rs
        # panics on §5.1 p95 budget violation when this is set. Kept as
        # signal-only (continue-on-error) because the §5.1 budgets are tight
        # and a loaded shared runner can transiently exceed them; the strict
        # gate above catches the regressions that actually matter.
        working-directory: src-tauri
        env:
          COCO_PERF_GATE: "1"
        run: cargo test --release --test perf -- --ignored --nocapture
        continue-on-error: true
