name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # don't cancel a release mid-way

jobs:
  build:
    name: Build + Publish (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      - name: Install npm deps
        run: npm ci

      - name: Install Windows code-signing certificate (optional)
        if: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          Write-Host "Installing code-signing cert into CurrentUser\My"
          $bytes = [System.Convert]::FromBase64String($env:WINDOWS_CERT_BASE64)
          $tmp = Join-Path $env:RUNNER_TEMP "coco-signing.pfx"
          [System.IO.File]::WriteAllBytes($tmp, $bytes)
          $secure = ConvertTo-SecureString -String $env:WINDOWS_CERT_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $tmp -Password $secure -CertStoreLocation Cert:\CurrentUser\My
          Remove-Item $tmp
          $thumb = $cert.Thumbprint
          Write-Host "Imported cert thumbprint: $thumb"
          "TAURI_WINDOWS_SIGN_THUMBPRINT=$thumb" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Tauri build (signed)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Sign Windows artifacts (optional)
        if: ${{ env.TAURI_WINDOWS_SIGN_THUMBPRINT != '' }}
        shell: pwsh
        run: |
          $thumb = $env:TAURI_WINDOWS_SIGN_THUMBPRINT
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Select-Object -Last 1).FullName
          if (-not $signtool) {
            Write-Error "signtool.exe not found in Windows Kits; cannot sign artifacts"
            exit 1
          }
          Write-Host "Using signtool: $signtool"
          $targets = Get-ChildItem "src-tauri/target/release/bundle" -Recurse -Include *.exe,*.msi -ErrorAction SilentlyContinue
          foreach ($f in $targets) {
            Write-Host "Signing $($f.FullName)"
            & $signtool sign /sha1 $thumb /tr "http://timestamp.digicert.com" /td sha256 /fd sha256 $f.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Error "signtool failed for $($f.FullName)"
              exit $LASTEXITCODE
            }
          }

      - name: Generate latest.json
        run: node scripts/build-latest-json.mjs

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $notesFile = "CHANGELOG/$tag.md"
          if (-not (Test-Path $notesFile)) { $notesFile = "CHANGELOG.md" }
          $hasNotes = Test-Path $notesFile
          $ghArgs = @("release", "create", $tag, "--title", "Coco $tag")
          if ($hasNotes) { $ghArgs += @("--notes-file", $notesFile) } else { $ghArgs += @("--generate-notes") }
          # Asset list — use Get-ChildItem to expand globs (gh's globbing on Windows is unreliable)
          $assets = @()
          $assets += "latest.json"
          $assets += Get-ChildItem "src-tauri/target/release/bundle/nsis/*.nsis.zip" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem "src-tauri/target/release/bundle/nsis/*.nsis.zip.sig" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi.zip" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi.zip.sig" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $ghArgs += $assets
          & gh @ghArgs
