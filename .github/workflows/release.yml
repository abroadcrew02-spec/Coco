name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # don't cancel a release mid-way

jobs:
  build:
    name: Build + Publish (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      - name: Install npm deps
        run: npm ci

      - name: Tauri build (signed)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Generate latest.json
        run: node scripts/build-latest-json.mjs

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $notesFile = "CHANGELOG/$tag.md"
          if (-not (Test-Path $notesFile)) { $notesFile = "CHANGELOG.md" }
          $hasNotes = Test-Path $notesFile
          $ghArgs = @("release", "create", $tag, "--title", "Coco $tag")
          if ($hasNotes) { $ghArgs += @("--notes-file", $notesFile) } else { $ghArgs += @("--generate-notes") }
          # Asset list — use Get-ChildItem to expand globs (gh's globbing on Windows is unreliable)
          $assets = @()
          $assets += "latest.json"
          $assets += Get-ChildItem "src-tauri/target/release/bundle/nsis/*.nsis.zip" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem "src-tauri/target/release/bundle/nsis/*.nsis.zip.sig" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi.zip" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi.zip.sig" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $ghArgs += $assets
          & gh @ghArgs
