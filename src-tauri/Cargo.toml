[package]
name = "coco"
version = "0.4.1"
edition = "2021"

[lib]
name = "coco_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "coco"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
calamine = "0.24"
rust_xlsxwriter = "0.77"
csv = "1.3"
encoding_rs = "0.8"
printpdf = { version = "0.7", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
futures-util = "0.3"
url = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
